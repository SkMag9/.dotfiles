### Theme
source = $HOME/.config/hypr/catppuccin.conf

### MONITORS ###
# See https://wiki.hyprland.org/Configuring/Monitors/
source = $HOME/.config/hypr/monitors.conf

xwayland {
  force_zero_scaling = true
}

### MY PROGRAMS ###
# See https://wiki.hyprland.org/Configuring/Keywords/
$terminal = kitty
$fileManager = dolphin -stylesheet "$HOME/.config/dolphin/catppuccin.qss"
$menu = rofi -show drun
$browser = brave --password-store=basic

### AUTOSTART ###
# Autostart necessary processes (like notifications daemons, status bars, etc.)
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = waybar 
exec-once = hyprpaper

### ENVIRONMENT VARIABLES ###
# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin mocha dark
env = HYPRCURSOR_SIZE,18
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_DATA_DIRS,"$XDG_DATA_DIRS:/var/lib/flatpak/exports/share:$HOME/.local/share/applications"
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
# Fix Qt Windows being squeezed
env = QT_QPA_PLATFORMTHEME,qt6ct

general {
    gaps_in = 0
    gaps_out = 0

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $lavender
    col.inactive_border = rgba($overlay0Alphaaa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = no, please :)
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    background_color = $base
}

### INPUT ###
# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = ch
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    numlock_by_default = true

    follow_mouse = 1

    sensitivity = -0.1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.2
    }
}


# https:
# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

### KEYBINDINGS ###
source = $HOME/.config/hypr/keybinds.conf

### WINDOWS AND WORKSPACES ###
windowrule = no_focus on
# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize,match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$,match:title ^$,match:xwayland on,match:float on,match:fullscreen on,match:pin off

# IntelliJ
# -- Fix odd behaviors in IntelliJ IDEs --
#! Fix splash screen showing in weird places and prevent annoying focus takeovers
windowrule = center on,match:class ^(jetbrains-.*)$,match:title ^(splash)$,match:float on
windowrule = no_focus on,match:class ^(jetbrains-.*)$,match:title ^(splash)$,match:float on
windowrule = border_size 0,match:class ^(jetbrains-.*)$,match:title ^(splash)$,match:float on

#! Center popups/find windows
windowrule = center on,match:class ^(jetbrains-.*)$,match:title ^( )$,match:float on
windowrule = stay_focused on,match:class ^(jetbrains-.*)$,match:title ^( )$,match:float on
windowrule = border_size 0,match:class ^(jetbrains-.*)$,match:title ^( )$,match:float on
#! Disable window flicker when autocomplete or tooltips appear
windowrule = no_focus on,match:class ^(jetbrains-.*)$,match:title ^(win.*)$,match:float on
